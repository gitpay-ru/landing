{%- assign lang = page.lang | default: site.lang -%}
{%- assign t = site.data.i18n[lang] -%}
<!doctype html>
<html lang="{{ lang }}" class="no-js">
  {% include head.html %}
  <body class="{{ page.body_class | default: 'page' }}">
    <a class="skip-link" href="#main">{{ t.nav.skip }}</a>
    {% include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
