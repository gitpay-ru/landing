<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#07090f">

  {%- if page.lang == "en" %}
    <link rel="alternate" hreflang="ru" href="{{ page.lang_url | default: '/' | absolute_url }}">
  {%- else %}
    <link rel="alternate" hreflang="en" href="{{ page.lang_url | default: '/en/' | absolute_url }}">
  {%- endif %}
  <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">

  <title>{% if page.title %}{{ page.title }} · {{ site.title_short }}{% else %}{{ t.meta.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ t.meta.description | strip_newlines | strip }}{% endif %}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title_short }}">
  <meta property="og:locale" content="{% if page.lang == 'en' %}en_US{% else %}ru_RU{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title_short }}{% else %}{{ t.meta.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ t.meta.description | strip_newlines | strip }}{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/og-image.png' | absolute_url }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {{ site.title_short }}{% else %}{{ t.meta.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ t.meta.description | strip_newlines | strip }}{% endif %}">
  <meta name="twitter:image" content="{{ '/assets/img/og-image.png' | absolute_url }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
