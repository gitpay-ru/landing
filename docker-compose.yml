name: gitpay-landing

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUBY_VERSION: "3.3"
        # Keep generated files owned by you, not by root.
        USER_UID: "${UID:-1000}"
        USER_GID: "${GID:-1000}"
    image: gitpay-landing:dev
    init: true
    # Match the host user so that `_site` is not written as root.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${JEKYLL_PORT:-4000}:4000"      # site
      - "${LIVERELOAD_PORT:-35729}:35729" # live reload websocket
    volumes:
      # Live source: every edit is picked up by the Jekyll watcher.
      - .:/site
      # Named volumes keep gems and the Jekyll cache out of the bind mount,
      # so they survive rebuilds and `docker compose down`.
      - gems:/usr/local/bundle
      - jekyll-cache:/site/.jekyll-cache
      - sass-cache:/site/.sass-cache
    environment:
      JEKYLL_ENV: development
      # Jekyll reads the locale from the environment; keep it stable.
      LANG: C.UTF-8
    command:
      - bundle
      - exec
      - jekyll
      - serve
      - --host=0.0.0.0
      - --port=4000
      # inotify does not propagate through bind mounts -> poll instead.
      # NOTE: no --incremental: it skips pages when _data files change.
      - --force_polling
      - --livereload
      - --livereload-min-delay=100

volumes:
  gems:
  jekyll-cache:
  sass-cache:
