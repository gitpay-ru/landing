faq:
  eyebrow: "Вопросы"
  title: "Частые вопросы"
  items:
    - q: "С чего начинается работа?"
      a: "С диагностики: разбираем процесс, данные и целевую метрику. Если задача не подходит под AI — говорим об этом на первом же этапе."
    - q: "Нужно ли менять текущие системы?"
      a: "Нет. Агенты работают поверх существующего ландшафта: 1С, CRM, почта, мессенджеры, репозитории. Глубокая интеграция на ваш выбор."
    - q: "Где размещается решение?"
      a: "Варианты: ваш сервер или облако, наш контур под ключ или интеграция по API. Для чувствительных данных — on-premise без передачи наружу."
    - q: "Как измеряется качество?"
      a: "До пилота собираем evals на ваших реальных примерах и фиксируем точность, скорость и стоимость. Дальше мониторим эти метрики в проде."
    - q: "Кто отвечает за результат агента?"
      a: "Архитектура предполагает человека в контуре: у агента есть уровни автономности, пороги уверенности и обязательная эскалация оператору."
    - q: "Сколько стоит?"
      a: "Пилот оценивается после диагностики: объём данных, интеграции, требования к размещению. Стоимость владения считаем вместе с вами — без скрытых платежей."

