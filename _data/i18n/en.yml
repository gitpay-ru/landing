faq:
  eyebrow: "FAQ"
  title: "Frequently asked questions"
  items:
    - q: "How does a project start?"
      a: "With discovery: we map the process, the data and the target metric. If the task does not fit AI, we say so at that very first stage."
    - q: "Do we have to replace our current systems?"
      a: "No. Agents sit on top of your existing landscape: 1C, CRM, mail, messengers, repositories. Deep integration is optional."
    - q: "Where does the solution run?"
      a: "Your server or cloud, our managed setup, or an API integration. For sensitive data — on-premise with nothing leaving your network."
    - q: "How is quality measured?"
      a: "Before the pilot we assemble evals from your real cases and record accuracy, speed and cost. Then we keep watching those metrics in production."
    - q: "Who is responsible for the agent's output?"
      a: "The architecture keeps a human in the loop: autonomy levels, confidence thresholds and mandatory escalation to an operator."
    - q: "How much does it cost?"
      a: "We estimate the pilot after discovery: data volume, integrations, deployment requirements. We calculate the total cost of ownership with you — no hidden fees."

