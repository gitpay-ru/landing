platform:
  eyebrow: "Platform"
  title: "What is inside the solution"
  subtitle: "One data layer, a model zoo, quality control and observability."
  items:
    - icon: "layers"
      title: "Data & knowledge"
      text: "Connectors to databases, data marts, mail, messengers and file storages. RAG over your knowledge bases."
    - icon: "models"
