# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: Гит Пэй Рус
title_short: GitPay
lang: ru
email: contact@gitpay.ru
url: "https://gitpay.ru"
baseurl: ""
timezone: Europe/Moscow

tagline:
  ru: "ИИ-агенты для бизнеса"
  en: "AI agents for business"

address:
  city: "Санкт-Петербург"
  street: "ул. Галерная, д. 20-22, лит. А, помещ. 106-Н, офис 1"
  zip: "190098"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never

# Files that must never end up in _site
exclude:
  - Dockerfile
  - docker-compose.yml
  - docker-compose.*.yml
  - .dockerignore
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .ruby-lsp
  - node_modules

# `/en/…` pages carry this in front matter; nothing else is needed for i18n.
defaults:
  - scope:
      path: ""
    values:
      layout: default
